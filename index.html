<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Paciente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="cadastro.css" />
  </head>
  <body>
    <div class="pagina">
      <div class="cartao">
        <!-- Painel lateral com identidade visual da clínica -->
        <aside class="painel" aria-hidden="true">
          <div class="painel-conteudo">
            <span class="selo">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M12 21s-7.5-4.6-10.1-9.3C.4 8.6 1.7 5 5.1 4.2c2-.5 4 .3 5 2 .9-1.7 3-2.5 5-2 3.4.8 4.7 4.4 3.2 7.5C19.5 16.4 12 21 12 21z"
                  stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"
                />
              </svg>
            </span>
            <h1>Cadastro de<br />Paciente</h1>
            <p class="painel-texto">
              Preencha seus dados abaixo para agilizar seu atendimento.
              Leva menos de dois minutos.
            </p>

            <svg class="linha-vital" viewBox="0 0 300 60" preserveAspectRatio="none" aria-hidden="true">
              <polyline
                points="0,30 60,30 75,10 90,50 105,30 300,30"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <ul class="painel-lista">
              <li>Seus dados ficam protegidos</li>
              <li>Confirmação em poucos passos</li>
            </ul>
          </div>
        </aside>

        <!-- Formulário -->
        <main class="formulario-area">
          <form id="formCadastro" novalidate>
            <div class="campo">
              <label for="nome">Nome completo</label>
              <div class="campo-input">
                <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z" stroke="currentColor" stroke-width="1.6" />
                  <path d="M4 20.5c1.6-3.7 4.7-5.5 8-5.5s6.4 1.8 8 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
                <input type="text" id="nome" name="nome" maxlength="100" placeholder="Digite seu nome completo" required />
              </div>
              <span class="erro" id="erro-nome" role="alert"></span>
            </div>

            <div class="campo">
              <label for="cpf">CPF</label>
              <div class="campo-input">
                <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6" />
                  <path d="M7 15h4M7 11h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                </svg>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" required />
              </div>
              <span class="erro" id="erro-cpf" role="alert"></span>
            </div>

            <div class="campo-linha">
              <div class="campo">
                <label for="dataNascimento">Data de nascimento</label>
                <div class="campo-input">
                  <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <rect x="3" y="5" width="18" height="15" rx="2" stroke="currentColor" stroke-width="1.6" />
                    <path d="M3 9.5h18M8 3v3M16 3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                  </svg>
                  <input type="date" id="dataNascimento" name="dataNascimento" required />
                </div>
                <span class="erro" id="erro-dataNascimento" role="alert"></span>
              </div>

              <div class="campo">
                <label for="telefone">Telefone</label>
                <div class="campo-input">
                  <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path
                      d="M5 4h3l1.5 4L7 9.5a11 11 0 0 0 6 6L14.5 13l4 1.5v3c0 1.1-.9 2-2 2A15 15 0 0 1 3 5.5C3 4.9 3.9 4 5 4Z"
                      stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"
                    />
                  </svg>
                  <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" inputmode="numeric" maxlength="15" required />
                </div>
                <span class="erro" id="erro-telefone" role="alert"></span>
              </div>
            </div>

            <div class="campo">
              <label for="email">Email</label>
              <div class="campo-input">
                <svg class="icone" width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6" />
                  <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required />
              </div>
              <span class="erro" id="erro-email" role="alert"></span>
            </div>

            <button type="submit" class="botao-enviar">Cadastrar</button>

            <p class="mensagem-sucesso" id="mensagemSucesso" role="status"></p>
          </form>
        </main>
      </div>
    </div>

    <script src="cadastro.js"></script>
  </body>
</html>
